workflows:
  studyspark-ios-simulator:
    name: StudySpark iOS Simulator (.app)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Firebase CocoaPods dependencies
        script: |
          cd src
          pod install
      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/src/StudySpark.xcworkspace" \
            -scheme "StudySpark" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/StudySpark.app
      - /tmp/xcodebuild_logs/*.log

  studyspark-ios-ipa:
    name: StudySpark iOS signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: StudySpark App Store Connect
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.web.studyspark-sai-app-main
    scripts:
      - name: Install Firebase CocoaPods dependencies
        script: |
          cd src
          pod install
      - name: Apply Apple signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/StudySpark.xcworkspace" \
            --scheme "StudySpark"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/StudySpark.app
